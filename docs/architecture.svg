<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Local Privacy Guard Architecture</text>
  
  <!-- Local Machine Box -->
  <rect x="50" y="60" width="700" height="380" rx="15" fill="#f0fdf4" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" fill="#059669">🔒 YOUR LOCAL MACHINE (100% private)</text>
  
  <!-- PII Filter -->
  <rect x="80" y="110" width="200" height="100" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="140" text-anchor="middle" font-size="14" font-weight="bold">🛡️ PII Filter</text>
  <text x="180" y="165" text-anchor="middle" font-size="11">Regex + spaCy NER</text>
  <text x="180" y="185" text-anchor="middle" font-size="11">Detects: <EMAIL>, <PERSON>, etc.</text>
  
  <!-- Anonymized Text -->
  <rect x="320" y="110" width="160" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-size="14" font-weight="bold">📝 Anonymized</text>
  <text x="400" y="165" text-anchor="middle" font-size="11">Placeholders only</text>
  <text x="400" y="185" text-anchor="middle" font-size="11">No real PII</text>
  
  <!-- Memory/Embedding -->
  <rect x="520" y="110" width="200" height="100" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="620" y="140" text-anchor="middle" font-size="14" font-weight="bold">🧠 Memory</text>
  <text x="620" y="165" text-anchor="middle" font-size="11">Local Embedding</text>
  <text x="620" y="185" text-anchor="middle" font-size="11">sentence-transformers</text>
  
  <!-- Arrows -->
  <line x1="280" y1="160" x2="320" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="520" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- External API -->
  <rect x="320" y="260" width="160" height="80" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="290" text-anchor="middle" font-size="14" font-weight="bold">🌐 External LLM API</text>
  <text x="400" y="315" text-anchor="middle" font-size="11">Only anonymized data</text>
  
  <line x1="400" y1="210" x2="400" y2="260" stroke="#333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <!-- Embedding arrow -->
  <line x1="620" y1="210" x2="620" y2="300" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="560" y="290" width="120" height="40" rx="8" fill="#ddd6fe" stroke="#8b5cf6"/>
  <text x="620" y="315" text-anchor="middle" font-size="11">Local FAISS DB</text>
  
  <!-- Privacy Verifier -->
  <rect x="80" y="300" width="200" height="80" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="180" y="330" text-anchor="middle" font-size="14" font-weight="bold">✅ Privacy Verifier</text>
  <text x="180" y="355" text-anchor="middle" font-size="11">Checks on startup</text>
  
  <!-- Legend -->
  <text x="400" y="460" text-anchor="middle" font-size="12" fill="#666">All processing happens locally • No telemetry • No external PII detection</text>
</svg>