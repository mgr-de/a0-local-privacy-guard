# Local Privacy Guard - Default Configuration
# ============================================

# Master switch for the plugin
enabled: true

# ==================== PII FILTER SETTINGS ====================
pii_filter:
  enabled: true
  use_regex: true
  use_ner: true
  backend: local  # Optional: presidio or nym (DE/EN evaluation; dependencies required)
  # Nym is opt-in, CPU-only, and never downloads weights during a request.
  # nym_model_dir: /absolute/path/to/verified-nym-bundle
  # nym_threads: 1
  # nym_max_tokens: 512
  # nym_stride: 64
  # nym_threshold: 0.5
  action: redact
  log_detections: true
  # Legacy key retained for configuration compatibility. Runtime redact mode
  # always uses persistent, chat-owned mappings for local display restoration.
  store_mapping: true
  placeholder_format: "<{type}>"
  
  # Languages to load for NER detection
  # English (en) is ALWAYS loaded and cannot be disabled
  # Add additional languages here: de, fr, es, it, nl, pt, pl
  # Each language requires its spaCy model to be installed
  languages:
    - de
    # - fr    # Uncomment to enable French
    # - es    # Uncomment to enable Spanish
    # - it    # Uncomment to enable Italian
    # - nl    # Uncomment to enable Dutch
    # - pt    # Uncomment to enable Portuguese
    # - pl    # Uncomment to enable Polish

  # Custom regex patterns (added to built-in patterns)
  # custom_patterns:
  #   - name: "MY_CUSTOM_TYPE"
  #     regex: "your-pattern-here"
  #     replacement: "<MY_TYPE>"

# ==================== LOCAL EMBEDDING SETTINGS ====================
local_embedding:
  enabled: true
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  auto_configure: true
  verify_local: true

# ==================== PRIVACY VERIFICATION SETTINGS ====================
verification:
  enabled: true
  check_components:
    - embedding
    - memory
    - requesty
  warn_on_external: true
