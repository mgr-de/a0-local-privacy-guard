<!--
  Local Privacy Guard - Plugin Settings
  Multi-language PII filtering, embedding enforcement & startup verification.
  Binds to the framework-provided `config` scope; load/save is handled by the
  plugin settings modal (store gate pattern via <template x-if>).
-->
<html>
<head>
    <title>Local Privacy Guard</title>
</head>

<body>
    <div x-data>
        <template x-if="config">
            <div class="section">

                <div class="section-title">Local Privacy Guard</div>
                <div class="section-description">
                    PII filtering, local embeddings &amp; startup verification.
                    Restart Agent Zero after changing languages or the embedding model.
                </div>

                <!-- Master toggle -->
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable Privacy Guard</div>
                        <div class="field-description">Master switch for all privacy features</div>
                    </div>
                    <div class="field-control">
                        <input type="checkbox" x-model="config.enabled" />
                    </div>
                </div>

                <!-- PII Filter -->
                <template x-if="config.pii_filter">
                    <div class="section">
                        <div class="section-title">PII Filter</div>
                        <div class="section-description">Anonymize personal data before it is sent to any model provider.</div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Enable PII filtering</div>
                                <div class="field-description">Applies to chat and utility model calls</div>
                            </div>
                            <div class="field-control">
                                <input type="checkbox" x-model="config.pii_filter.enabled" />
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Action on detection</div>
                                <div class="field-description">What happens when PII is detected</div>
                            </div>
                            <div class="field-control">
                                <select x-model="config.pii_filter.action">
                                    <option value="redact">Redact - replace with placeholder</option>
                                    <option value="block">Block - reject message</option>
                                    <option value="log_only">Log only - do not modify</option>
                                </select>
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Detection methods</div>
                                <div class="field-description">Regex patterns and spaCy NER (names &amp; addresses)</div>
                            </div>
                            <div class="field-control">
                                <label><input type="checkbox" x-model="config.pii_filter.use_regex" /> Regex patterns</label>
                                <label><input type="checkbox" x-model="config.pii_filter.use_ner" /> AI detection (spaCy)</label>
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Languages</div>
                                <div class="field-description">English is always loaded. Each additional language requires its spaCy model (~50 MB), installed automatically on restart.</div>
                            </div>
                            <div class="field-control">
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('de')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('de') ? (config.pii_filter.languages || []).filter(x => x !== 'de') : [...(config.pii_filter.languages || []), 'de'])" /> Deutsch</label>
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('fr')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('fr') ? (config.pii_filter.languages || []).filter(x => x !== 'fr') : [...(config.pii_filter.languages || []), 'fr'])" /> Francais</label>
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('es')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('es') ? (config.pii_filter.languages || []).filter(x => x !== 'es') : [...(config.pii_filter.languages || []), 'es'])" /> Espanol</label>
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('it')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('it') ? (config.pii_filter.languages || []).filter(x => x !== 'it') : [...(config.pii_filter.languages || []), 'it'])" /> Italiano</label>
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('nl')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('nl') ? (config.pii_filter.languages || []).filter(x => x !== 'nl') : [...(config.pii_filter.languages || []), 'nl'])" /> Nederlands</label>
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('pt')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('pt') ? (config.pii_filter.languages || []).filter(x => x !== 'pt') : [...(config.pii_filter.languages || []), 'pt'])" /> Portugues</label>
                                <label><input type="checkbox" :checked="(config.pii_filter.languages || []).includes('pl')" @change="config.pii_filter.languages = ((config.pii_filter.languages || []).includes('pl') ? (config.pii_filter.languages || []).filter(x => x !== 'pl') : [...(config.pii_filter.languages || []), 'pl'])" /> Polski</label>
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Options</div>
                                <div class="field-description">Detection logging and placeholder mapping</div>
                            </div>
                            <div class="field-control">
                                <label><input type="checkbox" x-model="config.pii_filter.log_detections" /> Log detections</label>
                                <label><input type="checkbox" x-model="config.pii_filter.store_mapping" /> Store mapping (enables re-identification)</label>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Local Embedding -->
                <template x-if="config.local_embedding">
                    <div class="section">
                        <div class="section-title">Local Embedding</div>
                        <div class="section-description">Memory embeddings run 100% locally via sentence-transformers.</div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Enforce local embeddings</div>
                                <div class="field-description">Replaces external embedding providers in presets.yaml</div>
                            </div>
                            <div class="field-control">
                                <input type="checkbox" x-model="config.local_embedding.enabled" />
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Embedding model</div>
                                <div class="field-description">Must start with sentence-transformers/ for local execution</div>
                            </div>
                            <div class="field-control">
                                <input type="text" x-model="config.local_embedding.model" placeholder="sentence-transformers/..." />
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Auto-configure</div>
                                <div class="field-description">Apply the local embedding model to presets when the agent starts</div>
                            </div>
                            <div class="field-control">
                                <input type="checkbox" x-model="config.local_embedding.auto_configure" />
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Verify on startup</div>
                                <div class="field-description">Check local embedding configuration after each start</div>
                            </div>
                            <div class="field-control">
                                <input type="checkbox" x-model="config.local_embedding.verify_local" />
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Verification -->
                <template x-if="config.verification">
                    <div class="section">
                        <div class="section-title">Startup Verification</div>
                        <div class="section-description">Verify privacy configuration when the agent starts.</div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Run startup checks</div>
                                <div class="field-description">Verify privacy configuration on agent start</div>
                            </div>
                            <div class="field-control">
                                <input type="checkbox" x-model="config.verification.enabled" />
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Check components</div>
                                <div class="field-description">Which components to verify</div>
                            </div>
                            <div class="field-control">
                                <label><input type="checkbox" :checked="(config.verification.check_components || []).includes('embedding')" @change="config.verification.check_components = ((config.verification.check_components || []).includes('embedding') ? (config.verification.check_components || []).filter(x => x !== 'embedding') : [...(config.verification.check_components || []), 'embedding'])" /> Embedding (local)</label>
                                <label><input type="checkbox" :checked="(config.verification.check_components || []).includes('memory')" @change="config.verification.check_components = ((config.verification.check_components || []).includes('memory') ? (config.verification.check_components || []).filter(x => x !== 'memory') : [...(config.verification.check_components || []), 'memory'])" /> Memory (local)</label>
                                <label><input type="checkbox" :checked="(config.verification.check_components || []).includes('requesty')" @change="config.verification.check_components = ((config.verification.check_components || []).includes('requesty') ? (config.verification.check_components || []).filter(x => x !== 'requesty') : [...(config.verification.check_components || []), 'requesty'])" /> Requesty (gateway)</label>
                            </div>
                        </div>

                        <div class="field">
                            <div class="field-label">
                                <div class="field-title">Warn on external access</div>
                                <div class="field-description">Log warnings when components use external APIs</div>
                            </div>
                            <div class="field-control">
                                <input type="checkbox" x-model="config.verification.warn_on_external" />
                            </div>
                        </div>
                    </div>
                </template>

            </div>
        </template>
    </div>
</body>

</html>
